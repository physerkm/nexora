name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Sign in as manager@acme.test
        2. Open Transactions
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Error response or logs
      description: The `code` and `correlationId` from the error response help a lot.
      render: text
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: Windows 11, local PostgreSQL 18, Chrome 130
