name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  backend:
    name: Backend build & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: |
          dotnet restore Nexora.slnx
          dotnet tool restore

      - name: Build
        run: dotnet build Nexora.slnx -c Release --no-restore

      - name: Migrations are in sync with the model
        run: dotnet ef migrations has-pending-model-changes --project src/Nexora.Infrastructure --startup-project src/Nexora.Api --no-build --configuration Release

      - name: Unit tests
        run: dotnet test tests/Nexora.UnitTests -c Release --no-build --logger trx --results-directory TestResults

      # Testcontainers starts a real PostgreSQL 18 container (Docker is available on GitHub-hosted runners).
      - name: Integration tests (PostgreSQL via Testcontainers)
        run: dotnet test tests/Nexora.IntegrationTests -c Release --no-build --logger trx --results-directory TestResults

      - name: Idempotent migration script
        run: dotnet ef migrations script --idempotent --project src/Nexora.Infrastructure --startup-project src/Nexora.Api --no-build --configuration Release -o artifacts/migrations.sql

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-results
          path: |
            TestResults
            artifacts/migrations.sql

  frontend:
    name: Frontend build & component tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Component tests (Vitest + Testing Library, API mocked with MSW)
        run: npm test
      - run: npm run build

  e2e:
    name: Browser tests (Playwright, real API + PostgreSQL)
    runs-on: ubuntu-latest
    needs: [frontend]
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: nexora
          POSTGRES_PASSWORD: nexora
          POSTGRES_DB: nexora_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexora -d nexora_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      # Build up front so Playwright's server start-up (dotnet run) only has to launch the API.
      - name: Build API
        run: dotnet build ../src/Nexora.Api -c Release
      - name: Playwright tests
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Nexora.Api/Dockerfile
          push: false
          tags: nexora-api:${{ github.sha }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: nexora-web:${{ github.sha }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Compose file is valid
        run: JWT_SIGNING_KEY=ci-placeholder-signing-key-0123456789abcdef docker compose config --quiet
