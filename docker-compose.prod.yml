# Production override: serves the app over HTTPS on ports 80/443 via Caddy.
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# Requires DOMAIN in .env and a DNS A record pointing the domain to this server.
services:
  # The database and cache are reachable only from the other containers, never from outside.
  postgres:
    ports: !reset []
    restart: unless-stopped

  redis:
    ports: !reset []

  # Daily pg_dump into ./backups (see deploy/backup.sh). Copy the folder off the server as well.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/backup.sh"]
    environment:
      PGHOST: postgres
      PGDATABASE: nexora
      PGUSER: nexora
      PGPASSWORD: ${POSTGRES_PASSWORD:-nexora}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./deploy/backup.sh:/backup.sh:ro
      - ./backups:/backups
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN (e.g. app.example.com) in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

  # Reachable only through Caddy, so nobody can bypass HTTPS on ports 3000/8080.
  web:
    ports: !reset []
    restart: unless-stopped

  api:
    ports: !reset []
    environment:
      # Caddy + nginx: both are trusted to report the client IP.
      ReverseProxy__ForwardLimit: "2"
      PasswordReset__PublicUrl: https://${DOMAIN}

volumes:
  caddy_data:
  caddy_config:
